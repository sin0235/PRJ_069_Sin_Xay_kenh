name: Kiểm thử video từ xa
on:
  workflow_dispatch:
    inputs:
      origin:
        description: Origin HTTPS của BE local qua Tunnel
        required: true
      session_id:
        description: Mã phiên worker do BE tạo
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: prj069-kiem-thu-video
  cancel-in-progress: false
jobs:
  kiem_thu:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      REMOTE_EXPECTED_ORIGIN: ${{ vars.PRJ069_REMOTE_ORIGIN }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CONTENT_VIDEO_RENDER_WORKERS: '1'
      CONTENT_VIDEO_RENDER_FALLBACK: '0'
      REMOTE_ENGINE_CHILD: '1'
      CONTENT_VIDEO_WORKER_ENABLED: '0'
      APP_ENV: test
      TESTING: '1'
    steps:
      - name: Giải phóng dung lượng runner cho nguồn video lớn
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h "$RUNNER_TEMP"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: sin_content_api/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Cài công cụ cho engine hiện hữu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core
          python -m pip install -r sin_content_api/requirements.txt soundfile numpy python-multipart vieneu==3.8.3 onnxruntime==1.28.0
          python -m playwright install --with-deps chromium
          npm ci --prefix sin_content_api/engines/hyperframes
          npm ci --prefix sin_content_api/engines/remotion
      - name: Cài công cụ gỡ logo Flow đã xác minh
        run: |
          curl -fsSL https://github.com/allenk/VeoWatermarkRemover/releases/download/v0.6.5-demo/GeminiWatermarkTool-Linux-x64-Video.zip -o "$RUNNER_TEMP/veo.zip"
          echo "958a8f429208848af55d461754a841d5c5703301a61ac66d045831c5a9622654  $RUNNER_TEMP/veo.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/veo.zip" -d "$RUNNER_TEMP/veo"
          VEO_TOOL=$(find "$RUNNER_TEMP/veo" -type f -name GeminiWatermarkTool-Video -print -quit)
          test -n "$VEO_TOOL"
          chmod +x "$VEO_TOOL"
          echo "PRJ069_VEO_REMOVER_PATH=$VEO_TOOL" >> "$GITHUB_ENV"
      - name: Nhận và thực hiện tác vụ kiểm thử
        env:
          INPUT_ORIGIN: ${{ inputs.origin }}
          INPUT_SESSION: ${{ inputs.session_id }}
        run: python sin_content_api/scripts/chay_tac_vu_tu_xa.py --origin "$INPUT_ORIGIN" --session-id "$INPUT_SESSION"
