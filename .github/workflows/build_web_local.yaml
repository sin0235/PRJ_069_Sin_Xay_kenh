name: Build giao diện cho máy local
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      API_INTERNAL_URL: http://127.0.0.1:8001
      NODE_OPTIONS: --max-old-space-size=8192
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af6772620
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Xác nhận tài nguyên runner
        shell: pwsh
        run: |
          $cpu = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          $ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          Write-Output "Runner: $cpu CPU logic, $ram GB RAM"
      - name: Cài dependency và build FE
        shell: pwsh
        working-directory: sin_creator_os
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global pnpm@10.24.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Recurse public .next/standalone/public
          Copy-Item -Recurse .next/static .next/standalone/.next/static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: giao_dien_windows
          path: sin_creator_os/.next/standalone/
          include-hidden-files: true
          retention-days: 1
