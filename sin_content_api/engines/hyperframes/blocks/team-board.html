<!doctype html>
<!--
  team-board: HyperFrames component scene (Bàn cờ đội ngũ)
  Thiết kế theo chuẩn Origami Editorial Motion B2B v1.
-->
<html
  lang="vi"
  data-composition-id="team-board"
  data-composition-duration="10"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Tiêu đề", "default": "QUẢN LÝ TIẾN ĐỘ VÀ ĐỘI NGŨ" },
    { "id": "role_absent", "type": "string", "role": "content", "label": "Vai trò vắng mặt", "default": "Người phê duyệt" },
    { "id": "steps", "type": "string", "role": "content", "label": "Các thẻ việc", "default": "Duyệt báo giá, Ký hợp đồng, Giao việc kỹ thuật" },
    { "id": "pick", "type": "number", "role": "content", "label": "Vị trí vắng mặt", "default": 1 },
    { "id": "tag", "type": "string", "role": "content", "label": "Thẻ đỏ khẩn", "default": "Tắc nghẽn 3 ngày" },
    { "id": "value", "type": "string", "role": "content", "label": "Số việc dồn", "default": "18 VIỆC" },
    { "id": "caption", "type": "string", "role": "content", "label": "Kết luận", "default": "Người quản lý phải liên tục nhắc việc và xử lý vụn vặt" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Team Board</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="team-board" data-duration="10" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #0a1c2b;
            font-family: 'Viet', sans-serif;
            color: #f6efe0;
            user-select: none;
          }
          .-world {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
          }
          .-back, .-mid, .-front, .-fx { position: absolute; inset: 0; }
          .-front, .-fx { pointer-events: none; }
          .title-box {
            position: absolute;
            top: 7%;
            left: 6%;
            font-size: 38px;
            font-weight: 800;
            color: #ffd54a;
            display: flex;
            gap: 12px;
            z-index: 10;
          }
          .title-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
          }
          /* Hàng nhân vật phía trên */
          .team-row {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 140px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
          }
          .char-slot {
            position: relative;
            width: 90px;
            height: 120px;
            transform-origin: 50% 100%;
          }
          .empty-chair {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 75px;
          }
          /* Bảng 3 cột phía dưới */
          .kanban-board {
            position: absolute;
            top: 34%;
            left: 14%;
            width: 72%;
            height: 29%;
            display: flex;
            gap: 24px;
          }
          .kanban-col {
            flex: 1;
            background: #12324a;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.18);
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 20px rgba(6,17,27,0.35);
            position: relative;
          }
          .col-header {
            font-size: 15px;
            font-weight: 700;
            color: #5cc8c0;
            border-bottom: 2px solid rgba(255,255,255,0.12);
            padding-bottom: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
          }
          .col-header.wait-col {
            color: #ffd54a;
          }
          /* Thẻ việc nhỏ */
          .task-card {
            background: #1b4363;
            border-left: 4px solid #5cc8c0;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #f6efe0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
          }
          .task-flying {
            position: absolute;
            width: 140px;
            height: 38px;
            background: #5cc8c0;
            color: #0a1c2b;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.4);
            z-index: 15;
            pointer-events: none;
          }
          /* Thẻ đỏ báo khẩn */
          .red-alert-card {
            position: absolute;
            top: 48%;
            right: 17%;
            background: #e8695a;
            color: #fff;
            font-size: 16px;
            font-weight: 900;
            padding: 8px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(232,105,90,0.5);
            white-space: nowrap;
            opacity: 0;
            z-index: 20;
          }
          .stat-value-box {
            position: absolute;
            top: 22%;
            right: 8%;
            font-size: 46px;
            font-weight: 900;
            color: #ffd54a;
            opacity: 0;
          }
          .caption-chip {
            position: absolute;
            top: 62%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 50, 74, 0.95);
            border: 1.5px solid #5cc8c0;
            border-radius: 30px;
            padding: 12px 32px;
            font-size: 24px;
            font-weight: 600;
            color: #f6efe0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            white-space: nowrap;
            opacity: 0;
            z-index: 30;
          }
        </style>

        <div class="-world" id="world">
          <div class="-back" id="layer-back">
            <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0;opacity:0.2;">
              <line x1="0" y1="360" x2="1920" y2="360" stroke="#fff" stroke-width="2" />
            </svg>
          </div>

          <div class="-mid" id="layer-mid">
            <div class="title-box" id="title-box" data-obj="title-banner" data-kind="text" data-src="static" data-dst="stay"></div>

            <!-- Hàng nhân vật phía trên -->
            <div class="team-row" id="team-row">
              <div class="char-slot" id="char-slot-0" data-obj="char-0" data-kind="prop" data-src="static" data-dst="stay">
                <!-- Ghế trống -->
                <div class="empty-chair">
                  <svg viewBox="-25 -65 50 65" width="50" height="65"><line x1="-18" y1="0" x2="-14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><line x1="18" y1="0" x2="14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><polygon points="-22,-28 22,-28 18,-35 -18,-35" fill="#12324a"/><polygon points="-18,-35 18,-35 16,-62 -16,-62" fill="#0a1c2b"/></svg>
                </div>
                <!-- Nhân vật -->
                <div id="char-body-0" style="position:absolute;bottom:0;left:15px;">
                  <svg viewBox="-30 -85 60 85" width="60" height="85"><polygon points="-18,0 18,0 15,-28 -15,-28" fill="#0a1c2b"/><polygon points="-15,-28 0,-28 0,-58 -22,-52" fill="#5cc8c0"/><polygon points="0,-28 15,-28 22,-52 0,-58" fill="#46ada6"/><polygon points="-6,-58 6,-58 0,-48" fill="#ffd54a"/><polygon points="-14,-62 0,-56 14,-62 12,-80 0,-84 -12,-80" fill="#f6efe0"/></svg>
                </div>
              </div>

              <div class="char-slot" id="char-slot-1" data-obj="char-1" data-kind="prop" data-src="static" data-dst="offscreen-left">
                <div class="empty-chair">
                  <svg viewBox="-25 -65 50 65" width="50" height="65"><line x1="-18" y1="0" x2="-14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><line x1="18" y1="0" x2="14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><polygon points="-22,-28 22,-28 18,-35 -18,-35" fill="#12324a"/><polygon points="-18,-35 18,-35 16,-62 -16,-62" fill="#0a1c2b"/></svg>
                </div>
                <div id="char-body-1" style="position:absolute;bottom:0;left:15px;">
                  <svg viewBox="-30 -85 60 85" width="60" height="85"><polygon points="-18,0 18,0 15,-28 -15,-28" fill="#0a1c2b"/><polygon points="-15,-28 0,-28 0,-58 -22,-52" fill="#e8695a"/><polygon points="0,-28 15,-28 22,-52 0,-58" fill="#d15344"/><polygon points="-6,-58 6,-58 0,-48" fill="#ffd54a"/><polygon points="-14,-62 0,-56 14,-62 12,-80 0,-84 -12,-80" fill="#f6efe0"/></svg>
                </div>
              </div>

              <div class="char-slot" id="char-slot-2" data-obj="char-2" data-kind="prop" data-src="static" data-dst="stay">
                <div class="empty-chair">
                  <svg viewBox="-25 -65 50 65" width="50" height="65"><line x1="-18" y1="0" x2="-14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><line x1="18" y1="0" x2="14" y2="-28" stroke="#9fb4c4" stroke-width="3"/><polygon points="-22,-28 22,-28 18,-35 -18,-35" fill="#12324a"/><polygon points="-18,-35 18,-35 16,-62 -16,-62" fill="#0a1c2b"/></svg>
                </div>
                <div id="char-body-2" style="position:absolute;bottom:0;left:15px;">
                  <svg viewBox="-30 -85 60 85" width="60" height="85"><polygon points="-18,0 18,0 15,-28 -15,-28" fill="#0a1c2b"/><polygon points="-15,-28 0,-28 0,-58 -22,-52" fill="#5cc8c0"/><polygon points="0,-28 15,-28 22,-52 0,-58" fill="#46ada6"/><polygon points="-6,-58 6,-58 0,-48" fill="#ffd54a"/><polygon points="-14,-62 0,-56 14,-62 12,-80 0,-84 -12,-80" fill="#f6efe0"/></svg>
                </div>
              </div>
            </div>

            <!-- Bảng 3 cột Kanban -->
            <div class="kanban-board" data-obj="kanban-board" data-kind="prop" data-src="static" data-dst="stay">
              <div class="kanban-col" id="col-new">
                <div class="col-header">MỚI <span>3</span></div>
                <div class="task-card">Tiếp nhận yêu cầu</div>
                <div class="task-card">Khách gọi lại</div>
              </div>
              <div class="kanban-col" id="col-doing">
                <div class="col-header">ĐANG LÀM <span>2</span></div>
                <div class="task-card">Soạn hợp đồng</div>
              </div>
              <div class="kanban-col" id="col-wait" style="border-color:#ffd54a;">
                <div class="col-header wait-col">CHỜ DUYỆT <span id="wait-count" style="color:#e8695a;">4</span></div>
                <div id="wait-pile">
                  <div class="task-card" style="border-color:#ffd54a;">Báo giá gói AI</div>
                  <div class="task-card" style="border-color:#e8695a;">Kế hoạch quý 4</div>
                </div>
              </div>
            </div>

            <!-- Thẻ việc bay giữa 2 nhân vật -->
            <div class="task-flying" id="flying-task" data-obj="flying-task" data-kind="prop" data-src="spawn-from:char-0" data-dst="stay" style="top:22%; left:22%; opacity:0;">Báo giá khách hàng</div>

            <div class="red-alert-card" id="red-alert-card" data-obj="red-alert-card" data-kind="text" data-src="spawn-from:col-wait" data-dst="stay">TẮC NGHẼN 3 NGÀY</div>
            <div class="stat-value-box" id="stat-value" data-obj="stat-value" data-kind="text" data-src="offscreen-top" data-dst="stay">18 VIỆC</div>
            <div class="caption-chip" id="caption-chip" data-obj="caption-chip" data-kind="text" data-src="offscreen-bottom" data-dst="stay"></div>
          </div>

          <div class="-front" id="layer-front">
            <!-- Cốc bút góc bàn tiền cảnh thị sai 1.6 -->
            <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0;opacity:0.35;">
              <polygon points="120,950 160,950 165,1080 115,1080" fill="#12324a" />
            </svg>
          </div>
          <div class="-fx" id="layer-fx"></div>
        </div>

        <script>
          (function() {
            var vars = window.__hyperframes ? window.__hyperframes.getVariables() : {
              title: "QUẢN LÝ TIẾN ĐỘ VÀ ĐỘI NGŨ",
              role_absent: "Người phê duyệt",
              steps: "Duyệt báo giá, Ký hợp đồng, Giao việc kỹ thuật",
              pick: 1,
              tag: "Tắc nghẽn 3 ngày",
              value: "18 VIỆC",
              caption: "Người quản lý phải liên tục nhắc việc và xử lý vụn vặt"
            };

            var titleText = vars.title || "QUẢN LÝ TIẾN ĐỘ VÀ ĐỘI NGŨ";
            var tagText = vars.tag || "Tắc nghẽn 3 ngày";
            var valueText = vars.value || "18 VIỆC";
            var captionText = vars.caption || "Người quản lý phải liên tục nhắc việc";

            // 1. Tiêu đề
            var titleBox = document.getElementById("title-box");
            titleText.split(" ").forEach(function(w) {
              var s = document.createElement("span");
              s.className = "title-word";
              s.textContent = w;
              titleBox.appendChild(s);
            });

            document.getElementById("red-alert-card").textContent = tagText;
            document.getElementById("stat-value").textContent = valueText;
            document.getElementById("caption-chip").textContent = captionText;

            // 2. GSAP Timeline
            var tl = gsap.timeline({ paused: true });
            var world = document.getElementById("world");

            // 0.0 - 3.0s: Mở cảnh, chuyền việc trôi chảy giữa nhân vật 0 và 1
            tl.set(world, { scale: 1.02, x: 0, y: 0 });
            tl.to(".title-word", { opacity: 1, y: 0, duration: 0.5, stagger: 0.08, ease: "power3.out" }, 0.1);

            // Nhân vật 0 nghiêng 6 độ dự báo chuyền việc
            tl.to("#char-body-0", { rotation: 6, transformOrigin: "bottom center", duration: 0.3 }, 0.5);
            tl.fromTo("#flying-task",
              { left: "22%", top: "22%", opacity: 0, scale: 0.8 },
              { left: "48%", top: "20%", opacity: 1, scale: 1.0, duration: 0.8, ease: "power2.inOut" },
              0.8
            );
            // Nhân vật 1 nghiêng đón
            tl.to("#char-body-1", { rotation: -6, transformOrigin: "bottom center", duration: 0.3 }, 1.3);

            // 3.0 - 6.0s: Nhân vật 1 (người duyệt) đứng dậy và bước rời đi ra ngoài trái (offscreen-left)
            tl.to("#char-body-1", {
              left: "-180px",
              opacity: 0,
              duration: 1.2,
              ease: "power1.inOut"
            }, 3.0);

            // Thẻ việc chuyển sang cột chờ duyệt và trượt xuống dồn lại
            tl.to("#flying-task", {
              left: "68%",
              top: "42%",
              duration: 0.9,
              ease: "power2.out"
            }, 3.6);

            // Cột chờ duyệt tối dần xuống 55% và các thẻ dồn nén xuống đáy
            tl.to("#col-wait", { background: "#0a1f2e", duration: 1.5 }, 4.0);
            tl.to("#wait-count", { textContent: "12", duration: 0.8 }, 4.5);
            tl.to("#col-wait .task-card", { y: "+=10", duration: 0.5, ease: "bounce.out" }, 5.2);
            tl.to(world, { scale: 1.03, duration: 0.8, ease: "sine.inOut" }, 5.2);

            // 6.0 - 9.0s: Việc dồn, thẻ đỏ báo khẩn bật lên
            tl.to(world, { scale: 1.06, x: -30, y: 30, duration: 1.4, ease: "sine.inOut" }, 6.0);
            tl.fromTo("#red-alert-card",
              { opacity: 0, scale: 0 },
              { opacity: 1, scale: 1.0, duration: 0.6, ease: "elastic.out(1, 0.6)" },
              6.3
            );
            // Rung 3 nhịp
            tl.to("#red-alert-card", { x: "+=3", duration: 0.1, repeat: 5, yoyo: true }, 6.9);

            // 8.5 - 9.4s: Con số tổng kết hiện ra
            tl.fromTo("#stat-value", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 8.3);

            // Chip kết luận
            tl.fromTo("#caption-chip", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.5);

            // 9.4 - 10.0s: Thoát mờ
            tl.to(world, { y: 26, duration: 0.6, ease: "sine.inOut" }, 9.4);
            tl.to("#root", { opacity: 0, duration: 0.25, ease: "power1.in" }, 9.75);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["team-board"] = tl;
            window.__timelines["main"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
