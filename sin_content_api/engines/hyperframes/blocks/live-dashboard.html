<!doctype html>
<!--
  live-dashboard: HyperFrames component scene (Bảng điều khiển sống)
  Thiết kế theo chuẩn Origami Editorial Motion B2B v1.
-->
<html
  lang="vi"
  data-composition-id="live-dashboard"
  data-composition-duration="10"
  data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Tiêu đề", "default": "HIỆU SUẤT HOẠT ĐỘNG" },
    { "id": "labels", "type": "string", "role": "content", "label": "Nhãn trục", "default": "Thg 1, Thg 2, Thg 3, Thg 4" },
    { "id": "data", "type": "string", "role": "content", "label": "Chuỗi dữ liệu 1", "default": "35, 55, 82, 45" },
    { "id": "data2", "type": "string", "role": "content", "label": "Chuỗi dữ liệu 2", "default": "20, 32, 45, 78" },
    { "id": "unit", "type": "string", "role": "content", "label": "Đơn vị", "default": "%" },
    { "id": "to_value", "type": "number", "role": "content", "label": "Kim đồng hồ", "default": 82 },
    { "id": "tag", "type": "string", "role": "content", "label": "Nhãn nổi bật", "default": "Chi phí vận hành" },
    { "id": "caption", "type": "string", "role": "content", "label": "Kết luận", "default": "Chi phí tăng vọt trong khi doanh thu chững lại" }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Live Dashboard</title>
  </head>
  <body>
    <template>
      <div id="root" data-composition-id="live-dashboard" data-duration="10" data-fps="30">
        <style>
          #root {
            position: absolute;
            inset: 0;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #0a1c2b;
            font-family: 'Viet', sans-serif;
            color: #f6efe0;
            user-select: none;
          }
          .-world {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
          }
          .-back {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }
          .-mid {
            position: absolute;
            inset: 0;
          }
          .-front {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }
          .-fx {
            position: absolute;
            inset: 0;
            pointer-events: none;
          }
          .title-box {
            position: absolute;
            top: 7%;
            left: 6%;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffd54a;
            display: flex;
            gap: 12px;
            z-index: 10;
          }
          .title-word {
            display: inline-block;
            opacity: 0;
            transform: translateY(20px);
          }
          .pedestal {
            position: absolute;
            bottom: 30%;
            left: 10%;
            width: 60%;
            height: 14px;
            background: #12324a;
            border-top: 2px solid rgba(255,255,255,0.2);
            border-radius: 4px;
          }
          .bar-col {
            position: absolute;
            bottom: 31.4%;
            width: 80px;
            transform-origin: 50% 100%;
          }
          .bar-body {
            position: absolute;
            bottom: 0;
            width: 80px;
            background: #5cc8c0;
            border-radius: 4px 4px 0 0;
            box-shadow: 10px 16px 22px rgba(6,17,27,0.3);
            border-top: 2px solid rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 8px;
            font-weight: bold;
            font-size: 22px;
            color: #0a1c2b;
          }
          .bar-highlight .bar-body {
            background: #e8695a !important;
            color: #fff !important;
          }
          .bar-label {
            position: absolute;
            bottom: -36px;
            width: 100%;
            text-align: center;
            font-size: 18px;
            color: #9fb4c4;
            font-weight: 600;
            opacity: 0;
          }
          .gauge-box {
            position: absolute;
            right: 8%;
            top: 28%;
            width: 240px;
            height: 240px;
          }
          .kpi-card {
            position: absolute;
            background: #12324a;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 8px;
            padding: 16px 22px;
            box-shadow: 10px 16px 22px rgba(6,17,27,0.35);
          }
          .caption-chip {
            position: absolute;
            bottom: 24%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 50, 74, 0.95);
            border: 1.5px solid #5cc8c0;
            border-radius: 30px;
            padding: 12px 32px;
            font-size: 24px;
            font-weight: 600;
            color: #f6efe0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            white-space: nowrap;
            opacity: 0;
          }
          .tag-bubble {
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            background: #e8695a;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 12px;
            white-space: nowrap;
            opacity: 0;
          }
        </style>

        <div class="-world" id="world">
          <!-- Lớp nền thị sai 0.5 -->
          <div class="-back" id="layer-back">
            <svg viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0;opacity:0.35;">
              <polygon points="120,700 240,420 320,420 400,700" fill="#12324a" />
              <polygon points="360,700 460,350 560,350 640,700" fill="#0d2639" />
              <polygon points="600,700 700,480 820,480 920,700" fill="#12324a" />
              <polygon points="880,700 980,380 1100,380 1200,700" fill="#0d2639" />
              <polygon points="1250,700 1350,460 1480,460 1580,700" fill="#12324a" />
            </svg>
          </div>

          <!-- Lớp giữa (vật chính thị sai 1.0) -->
          <div class="-mid" id="layer-mid">
            <div class="title-box" id="title-box" data-obj="title-banner" data-kind="text" data-src="static" data-dst="stay"></div>
            <div class="pedestal" data-obj="pedestal" data-kind="prop" data-src="static" data-dst="stay"></div>

            <!-- Cụm cột biểu đồ mọc từ bệ -->
            <div id="bars-container"></div>

            <!-- Đồng hồ đo tròn bên phải -->
            <div class="gauge-box" id="gauge-meter" data-obj="gauge-meter" data-kind="prop" data-src="static" data-dst="stay">
              <svg viewBox="-50 -100 100 100" width="240" height="240">
                <circle cx="0" cy="-50" r="46" fill="#12324a" />
                <path d="M-38,-50 A38 38 0 0 1 -12,-84" stroke="#5cc8c0" stroke-width="8" fill="none" />
                <path d="M-12,-84 A38 38 0 0 1 20,-82" stroke="#ffd54a" stroke-width="8" fill="none" />
                <path d="M20,-82 A38 38 0 0 1 38,-50" stroke="#e8695a" stroke-width="8" fill="none" />
                <circle cx="0" cy="-50" r="8" fill="#f6efe0" />
                <g id="needle-group" transform="rotate(0, 0, -50)">
                  <polygon points="-3,-50 0,-85 3,-50" fill="#e8695a" />
                  <circle cx="0" cy="-50" r="3" fill="#0a1c2b" />
                </g>
              </svg>
            </div>

            <!-- Đường xu hướng nối đỉnh cột -->
            <svg id="trend-svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="position:absolute;inset:0;pointer-events:none;">
              <path id="trend-line-1" data-obj="trend-line-1" data-kind="fx" fill="none" stroke="#ffd54a" stroke-width="4" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000" />
              <path id="trend-line-2" data-obj="trend-line-2" data-kind="fx" fill="none" stroke="#e8695a" stroke-width="4" stroke-linecap="round" stroke-dasharray="1000" stroke-dashoffset="1000" />
              <circle id="pulse-dot" data-obj="pulse-dot" data-kind="fx" cx="0" cy="0" r="8" fill="#ffd54a" opacity="0" />
            </svg>

            <!-- Chip kết luận ở đáy -->
            <div class="caption-chip" id="caption-chip" data-obj="caption-chip" data-kind="text" data-src="offscreen-bottom" data-dst="stay"></div>
          </div>

          <!-- Tiền cảnh thị sai 1.6 -->
          <div class="-front" id="layer-front">
            <div class="kpi-card" id="kpi-1" data-obj="kpi-1" data-kind="prop" data-src="offscreen-right" data-dst="stay" style="top:12%; right:14%; opacity:0; transform:translateX(100px);">
              <div style="font-size:14px; color:#9fb4c4; font-weight:600;">DOANH THU</div>
              <div style="font-size:32px; font-weight:800; color:#5cc8c0;">+14.2%</div>
            </div>
            <div class="kpi-card" id="kpi-2" data-obj="kpi-2" data-kind="prop" data-src="offscreen-right" data-dst="stay" style="top:22%; right:14%; opacity:0; transform:translateX(100px);">
              <div style="font-size:14px; color:#9fb4c4; font-weight:600;">CHI PHÍ VẬN HÀNH</div>
              <div style="font-size:32px; font-weight:800; color:#e8695a;">+38.5%</div>
            </div>
          </div>

          <!-- Lớp hiệu ứng ánh sáng -->
          <div class="-fx" id="layer-fx"></div>
        </div>

        <script>
          (function() {
            var vars = window.__hyperframes ? window.__hyperframes.getVariables() : {
              title: "HIỆU SUẤT HOẠT ĐỘNG",
              labels: "Thg 1, Thg 2, Thg 3, Thg 4",
              data: "35, 55, 82, 45",
              data2: "20, 32, 45, 78",
              unit: "%",
              to_value: 82,
              tag: "Chi phí vận hành",
              caption: "Chi phí tăng vọt trong khi doanh thu chững lại"
            };

            var titleText = vars.title || "HIỆU SUẤT HOẠT ĐỘNG";
            var labels = (vars.labels || "Thg 1, Thg 2, Thg 3, Thg 4").split(",").map(function(s) { return s.trim(); });
            var values = (vars.data || "35, 55, 82, 45").split(",").map(function(s) { return parseFloat(s) || 0; });
            var values2 = (vars.data2 || "20, 32, 45, 78").split(",").map(function(s) { return parseFloat(s) || 0; });
            var unit = vars.unit || "%";
            var toValue = parseFloat(vars.to_value) || 82;
            var tagText = vars.tag || "Chi phí vận hành";
            var captionText = vars.caption || "Chi phí tăng vọt";

            // 1. Dựng tiêu đề từng từ
            var titleBox = document.getElementById("title-box");
            var words = titleText.split(" ");
            words.forEach(function(w) {
              var span = document.createElement("span");
              span.className = "title-word";
              span.textContent = w;
              titleBox.appendChild(span);
            });

            // 2. Dựng các cột biểu đồ
            var barsContainer = document.getElementById("bars-container");
            var maxVal = Math.max.apply(null, values.concat(values2).concat([100]));
            var startX = 14; // %
            var endX = 66; // %
            var stepX = (endX - startX) / Math.max(1, values.length - 1);
            var colPoints1 = [];
            var colPoints2 = [];

            values.forEach(function(val, idx) {
              var posX = startX + idx * stepX;
              var col = document.createElement("div");
              col.className = "bar-col";
              col.id = "bar-col-" + (idx + 1);
              col.setAttribute("data-obj", "bar-" + (idx + 1));
              col.setAttribute("data-kind", "prop");
              col.setAttribute("data-src", "static");
              col.setAttribute("data-dst", "stay");
              col.style.left = posX + "%";

              var hPx = (val / maxVal) * 320;
              var isHighlighted = (idx === 2); // Cột nhấn
              if (isHighlighted) col.classList.add("bar-highlight");

              col.innerHTML = '<div class="bar-body" style="height:0px;">' +
                '<span>' + val + unit + '</span>' +
                (isHighlighted ? '<div class="tag-bubble" id="tag-bubble" data-obj="tag-bubble" data-kind="text" data-src="spawn-from:bar-3" data-dst="stay">' + tagText + '</div>' : '') +
                '</div>' +
                '<div class="bar-label">' + (labels[idx] || ("Mục " + (idx+1))) + '</div>';

              barsContainer.appendChild(col);

              // Tọa độ cho SVG trend line (gốc y 1080 * 0.686 = 740px)
              var cx = (posX / 100) * 1920 + 40;
              var cy1 = 740 - hPx;
              var cy2 = 740 - (values2[idx] / maxVal) * 320;
              colPoints1.push(cx + "," + cy1);
              colPoints2.push(cx + "," + cy2);
            });

            // Gán path cho 2 đường xu hướng
            var path1 = document.getElementById("trend-line-1");
            var path2 = document.getElementById("trend-line-2");
            if (colPoints1.length > 1) path1.setAttribute("d", "M" + colPoints1.join(" L"));
            if (colPoints2.length > 1) path2.setAttribute("d", "M" + colPoints2.join(" L"));

            // Gán caption chip
            var capEl = document.getElementById("caption-chip");
            capEl.textContent = captionText;

            // 3. Dựng GSAP Timeline theo đặc tả Section 6.1
            var tl = gsap.timeline({ paused: true });
            var world = document.getElementById("world");

            // 0.0 - 0.8s: Mở cảnh, tiêu đề trượt từng từ, camera xuất phát tại (1.06, +3%, 0)
            tl.set(world, { scale: 1.06, x: 57, y: 0 }); // 3% of 1920 is ~57px
            tl.to(".title-word", { opacity: 1, y: 0, duration: 0.5, stagger: 0.08, ease: "power3.out" }, 0.1);

            // 0.6 - 3.0s: Cột mọc back.out(1.3), nhãn hiện, camera lướt thị sai sang (1.00, -6%, 0)
            values.forEach(function(val, idx) {
              var col = document.querySelector("#bar-col-" + (idx + 1) + " .bar-body");
              var hPx = (val / maxVal) * 320;
              tl.to(col, { height: hPx, duration: 0.8, ease: "back.out(1.3)" }, 0.6 + idx * 0.35);
              tl.to("#bar-col-" + (idx + 1) + " .bar-label", { opacity: 1, duration: 0.4 }, 1.0 + idx * 0.35);
            });

            // Camera lướt thị sai trong 2.4s (2.5%/giây)
            tl.to(world, { scale: 1.00, x: -115, y: 0, duration: 2.4, ease: "sine.inOut" }, 0.6);

            // Đường xu hướng 1 vẽ dần
            tl.to(path1, { strokeDashoffset: 0, duration: 1.4, ease: "power2.out" }, 1.2);

            // 3.0 - 4.4s: Nhấn cột nổi bật, camera đẩy vào êm (1.07, -8%, -2.5%)
            tl.to(world, { scale: 1.07, x: -150, y: -27, duration: 1.4, ease: "sine.inOut" }, 3.0);
            tl.to(".bar-col:not(.bar-highlight)", { opacity: 0.55, duration: 0.6 }, 3.0);
            tl.to("#tag-bubble", { opacity: 1, y: -6, duration: 0.5, ease: "back.out(1.5)" }, 3.2);

            // 3.2 - 5.2s: Kim đồng hồ quét từ 0 đến to_value (-90 độ đến +90 độ)
            var targetDeg = -90 + (toValue / 100) * 180;
            tl.fromTo("#needle-group", { rotation: -90 }, { rotation: targetDeg, duration: 1.2, ease: "elastic.out(1, 0.6)" }, 3.2);

            // 4.6 - 5.6s: Thẻ KPI vào từ ngoài phải
            tl.to("#kpi-1", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.6);
            tl.to("#kpi-2", { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.85);

            // 5.8 - 8.0s: Chuỗi thứ hai vẽ dần, camera quét ngang (1.03, +4%, 0)
            tl.to(path2, { strokeDashoffset: 0, duration: 1.6, ease: "power2.out" }, 5.8);
            tl.to(world, { scale: 1.03, x: 76, y: 0, duration: 2.2, ease: "sine.inOut" }, 5.8);

            // Điểm giao nhau nhấp nháy
            tl.to("#pulse-dot", { opacity: 1, scale: 1.6, duration: 0.4, repeat: 3, yoyo: true }, 6.8);

            // 8.0 - 9.4s: Lùi ra toàn cảnh (1.00, 0, 0), caption chip trượt lên
            tl.to(world, { scale: 1.00, x: 0, y: 0, duration: 1.4, ease: "power2.inOut" }, 8.0);
            tl.to(".bar-col:not(.bar-highlight)", { opacity: 1.0, duration: 0.6 }, 8.0);
            tl.fromTo(capEl, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.4);

            // 9.4 - 10.0s: Vi chuyển động và thoát mờ 0.25s cuối
            tl.to(world, { y: "-4px", duration: 0.6, ease: "sine.inOut" }, 9.4);
            tl.to("#root", { opacity: 0, duration: 0.25, ease: "power1.in" }, 9.75);

            tl.seek(0);
            window.__timelines = window.__timelines || {};
            window.__timelines["live-dashboard"] = tl;
            window.__timelines["main"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
