<!doctype html><html lang="vi"><head><meta charset="utf-8"><script src="gsap.min.js"></script><style>
@font-face{font-family:Baha;src:url(font.ttf)}*{box-sizing:border-box}body{margin:0;background:#101820;color:#f2eee6;font-family:Baha,Arial}#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#233849,#101820 70%);perspective:1800px}header{position:absolute;top:180px;left:90px;font-size:28px;letter-spacing:8px;color:#cbb98e}h1{position:absolute;left:90px;top:260px;font-size:76px;line-height:1.2;width:900px;margin:0}.world{position:absolute;top:750px;left:540px;transform-style:preserve-3d;transform:rotateX(-20deg) rotateY(-30deg)}.cube{position:absolute;transform-style:preserve-3d}.face{position:absolute;width:300px;height:300px;left:-150px;top:-150px;border:3px solid #e5d5b2;background:linear-gradient(140deg,#f3ecd9,#bca97d);backface-visibility:hidden;box-shadow:inset 0 0 40px #806f4540;color:#142632;display:flex;align-items:center;justify-content:center;font-size:44px;text-align:center}.front{transform:translateZ(150px)}.back{transform:rotateY(180deg) translateZ(150px)}.right{transform:rotateY(90deg) translateZ(150px)}.left{transform:rotateY(-90deg) translateZ(150px)}.top{transform:rotateX(90deg) translateZ(150px);background:#fff9e9}.bottom{transform:rotateX(-90deg) translateZ(150px)}.ring{position:absolute;width:740px;height:740px;left:170px;top:570px;border:2px solid #cbb98e50;border-radius:50%;transform:rotateX(65deg)}.caption{position:absolute;left:90px;right:120px;top:1330px;font-size:40px;line-height:1.5;color:#dfd6c2}.line{position:absolute;left:90px;top:1280px;width:850px;height:3px;background:#cbb98e;transform-origin:left}.badge{position:absolute;left:90px;top:1580px;border:1px solid #cbb98e;padding:20px 30px;font-size:26px;color:#cbb98e}
</style></head><body><div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920"><header>BAHA GROUP</header><h1>Từ ý tưởng<br>đến giá trị</h1><div class="ring"></div><div class="world"><div class="cube"><div class="face front">Ý TƯỞNG</div><div class="face back">GIÁ TRỊ</div><div class="face right">KỊCH BẢN</div><div class="face left">NỘI DUNG</div><div class="face top">BAHA</div><div class="face bottom"></div></div></div><div class="line"></div><div class="caption">Mỗi lớp nội dung tạo nên<br>một góc nhìn mới.</div><div class="badge">CHUYỂN ĐỘNG KHÔNG GIAN 3D</div></div><script>
const tl=gsap.timeline({paused:true});tl.from('header',{opacity:0,y:25,duration:.5},0).from('h1',{opacity:0,y:60,duration:.8},.15).from('.world',{scale:0,rotationY:-120,duration:1.2,ease:'back.out(1.3)'},.3).to('.cube',{rotationY:210,rotationX:18,duration:4.5,ease:'power1.inOut'},1).to('.world',{y:-50,duration:2,yoyo:true,repeat:1,ease:'sine.inOut'},1).from('.line',{scaleX:0,duration:.7},1.2).from('.caption',{opacity:0,y:30,duration:.6},1.6).from('.badge',{opacity:0,y:20,duration:.6},2).to('#root',{opacity:0,duration:.35},5.65);window.__timelines={main:tl};tl.seek(0);
</script></body></html>
