<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cảnh giấy dựng theo dữ liệu</title>
<style>
/*FONT_FACE*/
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; font-family: Viet, sans-serif; }
#stage { width: 1920px; height: 1080px; position: relative; overflow: hidden; transform-origin: 0 0; perspective: 1900px; perspective-origin: 50% 50%; }
#rig { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 50%; will-change: transform; }
svg { position: absolute; inset: 0; }
#rig > svg { transform-style: preserve-3d; backface-visibility: hidden; }
#caption { z-index: 5; pointer-events: none; overflow: visible; }
text { font-family: Viet, sans-serif; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: #0B0F17; color: #F2EEE6; display: flex; gap: 12px; align-items: center; font: 600 15px Viet, sans-serif; z-index: 5; }
#bar select, #bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #D9B26A; background: #0562AF; color: #F2EEE6; }
#bar input[type=range] { flex: 1; }
body.sach #bar { display: none; }
</style>
</head>
<body>
<div id="stage"><div id="rig" data-layout-allow-overflow><svg id="back" class="plane back" viewBox="0 0 1920 1080" width="1920" height="1080"></svg><svg id="sv" class="plane middle" viewBox="0 0 1920 1080" width="1920" height="1080"></svg><svg id="front" class="plane front" viewBox="0 0 1920 1080" width="1920" height="1080"></svg></div><svg id="caption" viewBox="0 0 1920 1080" width="1920" height="1080"><g id="cap"></g></svg></div>
<div id="bar"><select id="ps"></select><button id="pl">Phát</button><input id="sl" type="range" min="0" max="1000" value="0"><span id="tt">0,00s</span></div>
<script>/*CAMERA_MOTION*/</script>
<script>/*SCENE_JSON*/</script>
<script>
/* Cảnh giấy xác định: mọi hình là hàm thuần của t (giây) và dữ liệu cảnh (window.SCENE); tua tới t bất kỳ để chụp khung.
   Ngôn ngữ chuyển động theo bộ hiệu ứng của Founder (PRJ_086): giảm tốc mềm rồi dừng chính xác, không nảy, camera macro nhẹ, kéo nét,
   sợi chỉ, kính lúp, dấu son; mỗi cảnh một ý. Phụ đề do bước dựng cuối đốt, cảnh không tự vẽ phụ đề (trừ chế độ xem thử). */
var PORTRAIT = window.PORTRAIT === true, TRANSPARENT_BG = window.TRANSPARENT_BG === true, W = PORTRAIT ? 1080 : 1920, H = PORTRAIT ? 1920 : 1080, BASE = 800, KH = 560, K = 4, NS = "http://www.w3.org/2000/svg";
var COL = { bg: "#0B0F17", shadow: "#070A10", sheet: "#121B2B", ink: "#F2EEE6", cardInk: "#1b2a41", teal: "#0562AF", tealD: "#083D70", tealL: "#5FA8FF",
            navy: "#D9B26A", navyD: "#9A7339", navyL: "#F6E2B0", coral: "#ED1B24", grid: "#344256", gold: "#FABC11", mint: "#172434" };
function clamp(x, a, b) { return Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, x)); }
function seg(t, a, b) { return clamp((t - a) / Math.max(1e-6, b - a)); }
function eo(x) { return 1 - Math.pow(1 - x, 3); }
function eio(x) { return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function numRun(v, a, b) { return Number.isInteger(a) && Number.isInteger(b) ? String(Math.round(v)) : num(v); }   /* số đang chạy giữ số nguyên khi dữ liệu là số nguyên */
function num(v) { var r = Math.round(v * 10) / 10; return String(r).replace(".", ","); }
function metricText(value, progress) {
  var text = String(value), match = text.match(/^(\D*?)(\d+)(.*)$/);
  if (!match) return esc(text);
  var current = Math.round(Number(match[2]) * eo(progress));
  return esc(match[1] + String(current).replace(/\B(?=(\d{3})+(?!\d))/g, ".") + match[3]);
}
var mctx = document.createElement("canvas").getContext("2d");
function tw(str, fs, wt) { mctx.font = (wt || 700) + " " + fs + "px Viet"; return mctx.measureText(str).width; }
function fit(str, maxW, fs, wt) { while (fs > 14 && tw(str, fs, wt) > maxW) fs -= 2; return fs; }
function niceScale(maxv) {
  var raw = Math.max(maxv, 1e-9) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), st = 10 * mag, m = [1, 2, 2.5, 5, 10];
  for (var i = 0; i < m.length; i++) if (m[i] * mag >= raw) { st = m[i] * mag; break; }
  return { step: st, max: st * Math.ceil(maxv / st - 1e-9) };
}

var svg = document.getElementById("sv"), backSvg = document.getElementById("back"), frontSvg = document.getElementById("front"), rig = document.getElementById("rig"), stage = document.getElementById("stage"), P = null, cur = null;

/* ---------- khung chung: nền, tờ giấy, tiêu đề, lưới ---------- */
function build() {
  var back = '<defs><linearGradient id="backPanel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2940" stop-opacity=".98"/><stop offset=".55" stop-color="#121B2B" stop-opacity=".96"/><stop offset="1" stop-color="#101827" stop-opacity=".99"/></linearGradient>' +
    '<linearGradient id="backRim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9B26A" stop-opacity=".12"/><stop offset=".5" stop-color="#D9B26A" stop-opacity=".75"/><stop offset="1" stop-color="#F6E2B0" stop-opacity=".38"/></linearGradient>' +
    '<filter id="backShadow" x="-45%" y="-35%" width="190%" height="170%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity=".52"/></filter></defs>';
  var backShapes = !TRANSPARENT_BG ? '<rect x="-420" y="-420" width="' + (W + 840) + '" height="' + (H + 840) + '" fill="#0B0F17"/>' +
    (PORTRAIT ? '<rect x="62" y="170" width="936" height="1536" rx="30" fill="url(#backPanel)" stroke="#D9B26A" stroke-opacity=".65" stroke-width="3" filter="url(#backShadow)"/><path d="M94 172 H966" stroke="url(#backRim)" stroke-width="4" opacity=".9"/><path d="M64 220 V1660" stroke="#D9B26A" stroke-opacity=".12" stroke-width="2"/>' :
      '<rect x="170" y="70" width="1576" height="860" rx="26" fill="url(#backPanel)" stroke="#D9B26A" stroke-opacity=".65" stroke-width="3" filter="url(#backShadow)"/><path d="M198 72 H1718" stroke="url(#backRim)" stroke-width="4" opacity=".9"/><path d="M172 120 V880" stroke="#D9B26A" stroke-opacity=".12" stroke-width="2"/>') : "";
  backSvg.innerHTML = back + '<g id="backContent">' + backShapes + '</g>';
  var h = '<defs><linearGradient id="panelGlass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B2940" stop-opacity=".98"/><stop offset=".55" stop-color="#121B2B" stop-opacity=".96"/><stop offset="1" stop-color="#101827" stop-opacity=".99"/></linearGradient>' +
    '<linearGradient id="panelRim" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9B26A" stop-opacity=".12"/><stop offset=".5" stop-color="#D9B26A" stop-opacity=".75"/><stop offset="1" stop-color="#F6E2B0" stop-opacity=".38"/></linearGradient>' +
    '<filter id="sh" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity=".52"/></filter></defs>';
  stage.style.background = TRANSPARENT_BG ? "transparent" : "radial-gradient(ellipse at 78% 20%,rgba(5,98,175,.12),transparent 34%),linear-gradient(135deg,#14243A,#0B0F17 62%,#070A10)";
  if (PORTRAIT) {
    h += '<g id="cam"><g id="sheetG"></g>';
  } else {
    h += '<g id="cam"><g id="sheetG"></g>';
  }
  h += '<g id="content">';
  var fs = fit(P.title, PORTRAIT ? 820 : 1080, PORTRAIT ? 46 : 44);
  if (P.kind !== 'END_CARD' && P.kind !== 'OPEN_QUESTION') h += '<text x="' + (PORTRAIT ? 132 : 250) + '" y="' + (PORTRAIT ? 300 : 152) + '" font-size="' + fs + '" font-weight="700" fill="' + COL.ink + '">' + esc(P.title) + '</text>';
  if (P.unit) h += '<text x="' + (PORTRAIT ? 132 : 250) + '" y="' + (PORTRAIT ? 345 : 190) + '" font-size="24" fill="#AAB7C8">Đơn vị: ' + esc(P.unit) + '</text>';
  if (P.axis && P.kind !== 'STACK_HEIGHT') {
    for (var g = 0; g <= P.axis.max / P.axis.step + 1e-9; g++) {
      var y = BASE - g * P.axis.step * K;
      h += '<line x1="250" x2="1680" y1="' + y + '" y2="' + y + '" stroke="' + COL.grid + '" stroke-width="2" stroke-dasharray="3 9"/><text x="236" y="' + (y + 8) + '" font-size="22" text-anchor="end" fill="#9AA9BD">' + num(g * P.axis.step) + '</text>';
    }
    h += '<line x1="250" x2="1680" y1="' + BASE + '" y2="' + BASE + '" stroke="' + COL.ink + '" stroke-width="4"/>';
    var n = P.labels.length, gw = 1430 / n;
    for (var m = 0; m < n; m++) h += '<text x="' + (250 + gw * (m + .5)) + '" y="' + (BASE + 44) + '" font-size="' + fit(P.labels[m], gw - 12, 28, 600) + '" font-weight="600" text-anchor="middle" fill="' + COL.ink + '">' + esc(P.labels[m]) + '</text>';
  }
  if (P.kind === 'STACK_HEIGHT') h += '<line x1="250" x2="1680" y1="' + BASE + '" y2="' + BASE + '" stroke="' + COL.ink + '" stroke-width="4"/>';
  h += '<g id="layer"></g></g>';
  svg.innerHTML = h;
  var simX = PORTRAIT ? 650 : 1396, simY = PORTRAIT ? 215 : 120;
  frontSvg.innerHTML = P.simulated === false ? "" : '<g><rect x="' + simX + '" y="' + simY + '" width="250" height="44" rx="10" fill="#1B2940" stroke="#D9B26A" stroke-opacity=".75"/><text x="' + (simX + 125) + '" y="' + (simY + 30) + '" font-size="22" font-weight="600" text-anchor="middle" fill="#F6E2B0">Dữ liệu mô phỏng</text></g>';
}

function paperBar(x, w, hpx, c, cd, cl, d) {
  if (hpx < 1) return "";
  var y = BASE - hpx, mid = y + hpx * .5;
  return '<g filter="url(#sh)"><polygon points="' + (x + w) + ',' + y + ' ' + (x + w + d) + ',' + (y - d * .6) + ' ' + (x + w + d) + ',' + (BASE - d * .6) + ' ' + (x + w) + ',' + BASE + '" fill="' + cd + '"/>' +
    '<polygon points="' + x + ',' + y + ' ' + (x + d) + ',' + (y - d * .6) + ' ' + (x + w + d) + ',' + (y - d * .6) + ' ' + (x + w) + ',' + y + '" fill="' + cl + '"/>' +
    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + hpx + '" fill="' + c + '"/><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + (hpx * .5) + '" fill="#fff" opacity=".10"/>' +
    '<line x1="' + x + '" x2="' + (x + w) + '" y1="' + mid + '" y2="' + (mid - 6) + '" stroke="#000" stroke-opacity=".18" stroke-width="3"/></g>';
}

/* ---------- CHART_TARGET: cột giấy, vạch mục tiêu, sợi chỉ nối khoảng thiếu (FX09, FX11, WW_LEVELLINE, WW_THREAD) ---------- */
function sceneChartTarget(t, p) {
  var a = p.t, n = p.labels.length, gw = 1430 / n, bw = Math.min(78, gw * .33), d = Math.round(bw * .2), out = "";
  var sec = p.series.length > 1 ? p.series[0] : null, main = p.series[p.series.length - 1];
  var cs = Math.min(.17, .9 / n), rs = Math.min(.08, .5 / n), dim = eo(seg(t, a.gap, a.gap + .4)), ty = BASE - p.target * K;
  for (var m = 0; m < n; m++) {
    var cx = 250 + gw * (m + .5), og = m < n - 1 ? 1 - .62 * dim : 1;
    out += '<g opacity="' + og + '">';
    if (sec) {
      var hs = sec.values[m] * K * eo(seg(t, a.s0 + m * cs, a.s0 + m * cs + .38));
      out += paperBar(cx - bw - 6, bw, hs, COL.navy, COL.navyD, COL.navyL, d);
      var vs = seg(t, a.s0 + m * cs + .30, a.s0 + m * cs + .5);
      if (vs > 0) out += '<text x="' + (cx - bw / 2 - 6) + '" y="' + (BASE - hs - 24) + '" font-size="26" font-weight="700" text-anchor="middle" fill="' + COL.navyD + '" opacity="' + vs + '">' + num(sec.values[m]) + '</text>';
    }
    var t1 = sec ? a.s1 : a.s0, hm = main.values[m] * K * eo(seg(t, t1 + m * rs, t1 + m * rs + .40)), mx = sec ? cx + 6 : cx - bw / 2;
    out += paperBar(mx, bw, hm, COL.teal, COL.tealD, COL.tealL, d);
    var vm = seg(t, t1 + m * rs + .35, t1 + m * rs + .55);
    if (vm > 0) out += '<text x="' + (mx + bw / 2) + '" y="' + (BASE - hm - 24) + '" font-size="26" font-weight="700" text-anchor="middle" fill="' + COL.tealD + '" opacity="' + vm + '">' + num(main.values[m]) + '</text>';
    out += '</g>';
  }
  if (p.tag && sec) {
    var sa = seg(t, a.s0 + .55, a.s0 + 1.0), fa = 1 - seg(t, a.target - .1, a.target + .25);
    if (sa > 0 && fa > 0) {
      var tx = 250 + gw * (n - .5) - 6 - bw / 2 - 170, ty0 = BASE - Math.max.apply(null, sec.values) * K - 70, tfs = fit(p.tag, 200, 28);
      out += '<g opacity="' + (eo(sa) * fa) + '"><rect x="' + (tx - 112) + '" y="' + (ty0 - 24) + '" width="224" height="48" rx="10" fill="' + COL.navy + '"/><text x="' + tx + '" y="' + (ty0 + 9) + '" font-size="' + tfs + '" font-weight="700" text-anchor="middle" fill="#fff">' + esc(p.tag) + '</text></g>';
    }
  }
  var st = seg(t, a.target, a.target + .5);
  if (st > 0) {
    out += '<line x1="250" x2="' + (250 + 1430 * eio(st)) + '" y1="' + ty + '" y2="' + ty + '" stroke="' + COL.coral + '" stroke-width="6" stroke-dasharray="26 14"/>';
    out += '<g opacity="' + clamp(st * 2) + '"><rect x="1450" y="' + (ty - 56) + '" width="230" height="46" rx="10" fill="' + COL.coral + '"/><text x="1565" y="' + (ty - 24) + '" font-size="' + fit("Mục tiêu " + num(p.target), 210, 28) + '" font-weight="700" text-anchor="middle" fill="#fff">Mục tiêu ' + num(p.target) + '</text></g>';
  }
  var sg = seg(t, a.gap, a.gap + .45), last = main.values[n - 1], diff = p.target - last;
  if (sg > 0) {
    var cxl = 250 + gw * (n - .5), right = sec ? cxl + 6 + bw : cxl + bw / 2, gx = right + d + 6, y2 = BASE - last * K - d * .6, yy = y2 + (ty - y2) * eo(sg);
    out += '<line x1="' + gx + '" y1="' + y2 + '" x2="' + gx + '" y2="' + yy + '" stroke="' + COL.coral + '" stroke-width="4"/><circle cx="' + gx + '" cy="' + y2 + '" r="9" fill="' + COL.coral + '"/>' +
           '<circle cx="' + gx + '" cy="' + yy + '" r="9" fill="#fff" stroke="' + COL.coral + '" stroke-width="4"/>' +
           '<g opacity="' + clamp(sg * 2) + '"><rect x="' + (gx - 330) + '" y="' + (Math.min(ty, y2) + 8) + '" width="300" height="52" rx="12" fill="#fff" stroke="' + COL.coral + '" stroke-width="4"/>' +
           '<text x="' + (gx - 180) + '" y="' + (Math.min(ty, y2) + 44) + '" font-size="30" font-weight="700" text-anchor="middle" fill="' + COL.coral + '">' + (diff > 0 ? "Chưa đạt: " : "Vượt: ") + num(Math.abs(diff)) + '</text></g>';
  }
  var lx = 250; out += '';
  p.series.forEach(function (s, i) { var c = (p.series.length > 1 && i === 0) ? COL.navy : COL.teal; out += '<rect x="' + lx + '" y="888" width="30" height="22" fill="' + c + '"/><text x="' + (lx + 42) + '" y="908" font-size="26" fill="' + COL.ink + '">' + esc(s.name) + '</text>'; lx += 180 + tw(s.name, 26, 400); });
  return out;
}

/* ---------- CHART_GROWTH: đường giấy vẽ dần, số đếm khớp, nhãn phần trăm (FX09) ---------- */
function sceneChartGrowth(t, p) {
  var a = p.t, s0 = p.series[0], vals = s0.values, n = vals.length, gw = 1430 / n, out = "", pts = [];
  for (var i = 0; i < n; i++) pts.push([250 + gw * (i + .5), BASE - vals[i] * K]);
  var dstr = "M" + pts.map(function (q) { return q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" L");
  var pr = eio(seg(t, a.line, a.end)), pe = document.createElementNS(NS, "path"); pe.setAttribute("d", dstr);
  var L = pe.getTotalLength();
  if (pr > 0) {
    var tip = pe.getPointAtLength(L * pr), area = "M" + pts[0][0] + " " + BASE;
    for (var s = 0; s <= 40; s++) { var q = pe.getPointAtLength(L * s / 40 * pr); area += " L" + q.x.toFixed(1) + " " + q.y.toFixed(1); }
    area += " L" + tip.x.toFixed(1) + " " + BASE + " Z";
    out += '<path d="' + area + '" fill="' + COL.teal + '" opacity=".16"/>';
    [['' + COL.tealD, 22, ' transform="translate(0 6)" opacity=".25"'], ['' + COL.teal, 16, ''], ['#7fd4c4', 5, ' transform="translate(0 -3)"']].forEach(function (z) {
      out += '<path d="' + dstr + '" fill="none" stroke="' + z[0] + '" stroke-width="' + z[1] + '" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="' + L + '" stroke-dashoffset="' + (L * (1 - pr)) + '"' + z[2] + '/>';
    });
    for (var k = 0; k < n; k++) {
      var frac = k / (n - 1), sp = clamp((pr - frac) * 14 + 1);
      if (pr >= frac - .001) out += '<g transform="translate(' + pts[k][0] + ' ' + pts[k][1] + ') scale(' + (.2 + .8 * eo(sp)) + ')"><circle r="22" fill="#fff" stroke="' + COL.tealD + '" stroke-width="7"/><circle r="8" fill="' + COL.tealD + '"/></g>' +
        '<text x="' + pts[k][0] + '" y="' + (pts[k][1] - 40) + '" font-size="28" font-weight="700" text-anchor="middle" fill="' + COL.tealD + '" opacity="' + sp + '">' + num(vals[k]) + '</text>';
    }
  }
  var sc = seg(t, a.line, a.final + .6), val = vals[0] + (vals[n - 1] - vals[0]) * eio(sc), so = seg(t, a.line - .1, a.line + .25), lab = s0.name + " hiện tại";
  out += '<g opacity="' + so + '"><rect x="270" y="214" width="440" height="150" rx="20" fill="#fff" stroke="' + COL.teal + '" stroke-width="5" filter="url(#sh)"/>' +
         '<text x="300" y="260" font-size="' + fit(lab, 380, 26, 400) + '" fill="#5b7a82">' + esc(lab) + '</text>' +
         '<text x="300" y="338" font-size="76" font-weight="800" fill="' + COL.tealD + '">' + num(val) + '<tspan font-size="30" font-weight="600" fill="#5b7a82"> ' + esc(p.unit || "") + '</tspan></text></g>';
  var sb = seg(t, a.final, a.final + .45);
  if (sb > 0 && vals[0] > 0) {
    var pct = Math.round((vals[n - 1] - vals[0]) / vals[0] * 100);
    out += '<g transform="translate(' + (pts[Math.max(0, n - 3)][0]) + ' ' + (BASE - (vals[0] + vals[n - 1]) / 2 * K * .55 + 70) + ')" opacity="' + eo(sb) + '"><rect x="0" y="-40" width="190" height="80" rx="40" fill="' + (pct >= 0 ? COL.coral : COL.navy) + '"/><text x="95" y="14" font-size="42" font-weight="800" text-anchor="middle" fill="#fff">' + (pct >= 0 ? "+" : "") + pct + '%</text></g>';
  }
  return out;
}

/* ---------- tiện ích tài liệu ---------- */
function docCard(x, y, w, h, title, op) {
  var o = '<g opacity="' + op + '"><rect x="' + (x + 10) + '" y="' + (y + 12) + '" width="' + w + '" height="' + h + '" rx="14" fill="#cdbf9c" opacity=".55"/>' +
    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="14" fill="#fffdf7" stroke="#cdbf9c" stroke-width="3"/>' +
    '<path d="M' + (x + w) + ' ' + y + ' v60 l-60 -60z" fill="#efe6cf"/><path d="M' + (x + w) + ' ' + (y + 60) + ' l-60 -60 v60z" fill="#d9cdae"/>' +
    '<text x="' + (x + 30) + '" y="' + (y + 64) + '" font-size="' + fit(title, w - 130, 30) + '" font-weight="700" fill="' + COL.cardInk + '">' + esc(title) + '</text>';
  for (var i = 0; i < 5; i++) o += '<rect x="' + (x + 30) + '" y="' + (y + 110 + i * 38) + '" width="' + (w - 60 - (i % 3) * 70) + '" height="12" rx="6" fill="#dcd6c3"/>';
  return o + '</g>';
}
function loupe(cx, cy, r, txt, fs, op, id) {
  return '<g opacity="' + op + '"><clipPath id="' + id + '"><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"/></clipPath><circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fffdf7"/>' +
    '<g clip-path="url(#' + id + ')"><text x="' + cx + '" y="' + (cy + fs * .35) + '" font-size="' + fs + '" font-weight="800" text-anchor="middle" fill="' + COL.cardInk + '">' + esc(txt) + '</text></g>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + COL.tealD + '" stroke-width="12"/>' +
    '<line x1="' + (cx + r * .72) + '" y1="' + (cy + r * .72) + '" x2="' + (cx + r * 1.45) + '" y2="' + (cy + r * 1.45) + '" stroke="' + COL.tealD + '" stroke-width="18" stroke-linecap="round"/></g>';
}
function loupeAt(t, t0, cx, cy, txt, id) {
  var on = eo(seg(t, t0, t0 + .35)) * (1 - eo(seg(t, t0 + 1.25, t0 + 1.7)));
  if (on <= 0) return "";
  var m = eo(seg(t, t0, t0 + .5));
