name: ${PRJ069_COMPOSE_PROJECT_NAME:-prj069-nas}

x-backend-build: &backend-build
  context: ../..
  dockerfile: ha_tang/nas_runtime/Dockerfile.backend

x-backend-environment: &backend-environment
  APP_ENV: production
  TESTING: "0"
  DEV_AUTH_BYPASS: "0"
  AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:?Set AUTH_OWNER_EMAIL in the deployment environment}
  SIN_WORKSPACE_ID: ${SIN_WORKSPACE_ID:?Set SIN_WORKSPACE_ID in the deployment environment}
  SIN_WORKSPACE_NAME: ${SIN_WORKSPACE_NAME:?Set SIN_WORKSPACE_NAME in the deployment environment}
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set exact AUTH_ALLOWED_ORIGINS in the deployment environment}
  AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
  BAHA_AUTH_JWT_SECRET: ${BAHA_AUTH_JWT_SECRET:?Set BAHA_AUTH_JWT_SECRET in the deployment environment}
  BAHA_AUTH_JWT_ISSUER: ${BAHA_AUTH_JWT_ISSUER:?Set BAHA_AUTH_JWT_ISSUER in the deployment environment}
  BAHA_AUTH_JWT_AUDIENCE: ${BAHA_AUTH_JWT_AUDIENCE:?Set BAHA_AUTH_JWT_AUDIENCE in the deployment environment}
  LLM_ENCRYPTION_MASTER_KEY: ${LLM_ENCRYPTION_MASTER_KEY:?Set LLM_ENCRYPTION_MASTER_KEY separately from the JWT secret}
  DATABASE_URL: sqlite:////data/sin_content_production.db
  BAHA_AUTH_DATABASE_URL: sqlite:////data/baha_auth_production.db
  SIN_DUNG_DB_PATH: /data/sin_dieu_phoi_dung.db
  MEDIA_ROOT_DIR: /data/media_assets
  PRJ069_BOOTSTRAP_MODE: ${PRJ069_BOOTSTRAP_MODE:-adopt}
  PRJ069_BOOTSTRAP_DATA_DIR: /data
  PRJ069_VIENU_HF_HOME: /models/vieneu
  WORKER_HEARTBEAT_PATH: /data/runtime/worker.json
  CONTENT_VIDEO_WORKER_ENABLED: "0"
  BROWSER_CHANNEL: chromium
  SYNTHETIC_DATA_ALLOWED: "false"
  FLOW_DESKTOP_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set exact AUTH_ALLOWED_ORIGINS in the deployment environment}
  FLOW_PROFILE_ROOT: /data/flow-profiles

services:
  init:
    image: ${PRJ069_BACKEND_IMAGE:-prj069-nas-backend:local}
    build: *backend-build
    init: true
    restart: "no"
    user: "0:0"
    mem_limit: 536870912
    memswap_limit: 536870912
    network_mode: none
    entrypoint:
      - /app/ha_tang/nas_runtime/init-entrypoint.sh
    command:
      - python
      - /app/scripts/khoi_tao_production_noi_bo.py
    environment:
      <<: *backend-environment
      AUTH_OWNER_PASSWORD_FILE: /run/secrets/owner-password
    secrets:
      - owner-password
    volumes:
      - app-data:/data
      - flow-profiles:/profile-volume-staging
      - models:/models
    stop_grace_period: 30s

  api:
    image: ${PRJ069_BACKEND_IMAGE:-prj069-nas-backend:local}
    build: *backend-build
    init: true
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 536870912
    memswap_limit: 536870912
    expose:
      - "8000"
    environment:
      <<: *backend-environment
      FLOW_CONTROL_URL: http://flow-session-worker:8090
      FLOW_DESKTOP_URL: http://flow-session-worker:6080
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - api-gateway
      - api-web
      - api-worker
    volumes:
      - app-data:/data
      - models:/models:ro
      - flow-profiles:/data/flow-profiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  flow-session-worker:
    image: ${PRJ069_BACKEND_IMAGE:-prj069-nas-backend:local}
    hostname: ${PRJ069_COMPOSE_PROJECT_NAME:-prj069-nas}-flow-worker
    cpus: 2.0
    init: true
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 3758096384
    memswap_limit: 3758096384
    shm_size: 512m
    command:
      - python
      - -m
      - src.worker_runtime
    expose:
      - "6080"
      - "8090"
    environment:
      <<: *backend-environment
      FLOW_NOVNC_WEB_ROOT: /usr/share/novnc
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - api-worker
      - worker-egress
    volumes:
      - app-data:/data
      - models:/models
      - flow-profiles:/data/flow-profiles
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - src.worker_runtime
        - --check
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    stop_grace_period: 45s

  web:
    image: ${PRJ069_WEB_IMAGE:-prj069-nas-web:local}
    build:
      context: ../..
      dockerfile: sin_creator_os/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    init: true
    restart: unless-stopped
    user: "10001:10001"
    mem_limit: 536870912
    memswap_limit: 536870912
    expose:
      - "3000"
    networks:
      - api-web
      - web-gateway
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      API_INTERNAL_URL: http://api:8000
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set exact AUTH_ALLOWED_ORIGINS in the deployment environment}
      AUTH_COOKIE_SECURE: "${AUTH_COOKIE_SECURE:-true}"
      NODE_OPTIONS: --max-old-space-size=384
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 45s
      start_interval: 5s
    stop_grace_period: 20s

  gateway:
    image: ${PRJ069_GATEWAY_IMAGE:-prj069-nas-gateway:local}
    build:
      context: ../..
      dockerfile: ha_tang/nas_runtime/Dockerfile.gateway
    init: true
    restart: unless-stopped
    mem_limit: 134217728
    memswap_limit: 134217728
    ports:
      - ${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3069}:8080
    networks:
      - api-gateway
      - web-gateway
      - public-edge
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/readyz
      interval: 20s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s

volumes:
  app-data:
    name: ${PRJ069_DATA_VOLUME:-prj069-nas-data}
  flow-profiles:
    name: ${PRJ069_PROFILE_VOLUME:-prj069-nas-flow-profiles}
  models:
    name: ${PRJ069_MODEL_VOLUME:-prj069-nas-models}

secrets:
  owner-password:
    file: ${AUTH_OWNER_PASSWORD_SECRET_FILE:?Set AUTH_OWNER_PASSWORD_SECRET_FILE to a read-only secret file}

networks:
  # Published ports need a non-internal network; only the gateway joins it.
  public-edge: {}
  api-gateway:
    internal: true
  web-gateway:
    internal: true
  api-web: {}
  api-worker:
    internal: true
  worker-egress: {}
