    <rect x="-35" y="-38" width="55" height="4" rx="1.5" fill="#f6efe0" opacity="0.8" />
    <rect x="-35" y="-28" width="45" height="4" rx="1.5" fill="#f6efe0" opacity="0.6" />
    <rect x="-35" y="-18" width="35" height="4" rx="1.5" fill="#f6efe0" opacity="0.4" />
