    <line x1="40" y1="-35" x2="-40" y2="-75" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <line x1="-40" y1="-75" x2="40" y2="-115" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
