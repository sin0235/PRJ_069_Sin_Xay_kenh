services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sin_postgres
    environment:
      POSTGRES_USER: sin_user
      POSTGRES_PASSWORD: sin_password
      POSTGRES_DB: sin_content_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sin_user -d sin_content_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sin_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../sin_content_api
      dockerfile: Dockerfile
    container_name: sin_api
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://sin_user:sin_password@postgres:5432/sin_content_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
